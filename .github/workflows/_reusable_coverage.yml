name: Reusable Coverage Check

on:
  workflow_call:

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install coverage tools
        env:
          # Unauthenticated api.github.com lookups are rate-limited per runner IP.
          # A 403 there makes binstall silently fall back to building from source,
          # and that fallback runs `cargo install` without --locked, which nextest
          # rejects with a compile_error!. Authenticate so the prebuilt is found,
          # and disable the compile fallback so a lookup failure fails fast and
          # loudly instead of after ~11 minutes of doomed compilation.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prebuilt downloads from GitHub can fail transiently (network flake),
          # which aborted the nightly run before any test executed. Retry the
          # install up to 3 times (20s, then 40s backoff) and fail with the last
          # exit code if every attempt fails.
          rc=0
          for attempt in 1 2 3; do
            rc=0
            cargo binstall --no-confirm --force --disable-strategies compile \
              greentic-dev cargo-nextest cargo-llvm-cov || rc=$?
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "cargo binstall failed (exit $rc), attempt $attempt/3; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          command -v greentic-dev
          command -v cargo-nextest
          command -v cargo-llvm-cov

      - name: Run coverage policy check
        run: greentic-dev coverage
