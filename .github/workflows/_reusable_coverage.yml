name: Reusable Coverage Check

on:
  workflow_call:

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install coverage tools
        env:
          # Unauthenticated api.github.com lookups are rate-limited per runner IP.
          # A 403 there makes binstall silently fall back to building from source,
          # and that fallback runs `cargo install` without --locked, which nextest
          # rejects with a compile_error!. Authenticate so the prebuilt is found,
          # and disable the compile fallback so a lookup failure fails fast and
          # loudly instead of after ~11 minutes of doomed compilation.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall --no-confirm --force --disable-strategies compile \
            greentic-dev cargo-nextest cargo-llvm-cov
          command -v greentic-dev
          command -v cargo-nextest
          command -v cargo-llvm-cov

      - name: Run coverage policy check
        run: greentic-dev coverage
